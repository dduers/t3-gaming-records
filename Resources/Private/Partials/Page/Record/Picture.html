<f:if condition="{data}">    
    <div class="container shadow border p-3">
        <div class="row">
            <f:for each="{data}" as="image">
                <f:if condition="{image}">
                    <div class="col-md-4">
                        <f:image image="{image}" alt="{image.alternative}" class="img-fluid shadow border p-0" />
                    </div>
                </f:if>
            </f:for>
        </div>
    </div>
</f:if>
