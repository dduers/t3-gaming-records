<button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#deleteRecordModal">
    Delete this record
</button>

<f:debug title="Debug Record Data">{data.record}</f:debug>

<div class="modal fade" id="deleteRecordModal" tabindex="-1" aria-labelledby="deleteRecordModalLabel"
    aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Delete Record</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this record?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>

                <f:link.action class="btn btn-danger" controller="Record" pluginName="record" action="delete"
                    arguments="{recordId: data.record.uid}">
                    Delete</f:link.action>
            </div>
        </div>
    </div>
</div>
